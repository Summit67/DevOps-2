name: final-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=7d]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: [127.0.0.1:19091:9090]
    networks: [audit-edge, monitoring]
    restart: unless-stopped
    mem_limit: 256m
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/audit-svc.json:/var/lib/grafana/dashboards/audit-svc.json:ro
      - ./grafana/nginx.json:/var/lib/grafana/dashboards/nginx.json:ro
    ports: [127.0.0.1:13001:3000]
    networks: [monitoring]
    restart: unless-stopped
    mem_limit: 256m
networks:
  audit-edge:
    external: true
  monitoring: {}
volumes:
  prometheus-data: {}
  grafana-data: {}
