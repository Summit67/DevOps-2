---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Restart PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ postgres__service_name }}"
    state: restarted
  become: true

- name: Restart postgres-exporter
  ansible.builtin.systemd_service:
    name: "{{ postgres__exporter_service_name }}"
    state: restarted
  become: true
