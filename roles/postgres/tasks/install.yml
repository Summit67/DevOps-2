---
- name: Install packages from Ubuntu repositories
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgres__version }}"
      - python3-psycopg2
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101

- name: Disable the default Ubuntu cluster
  ansible.builtin.systemd_service:
    name: "{{ __ubuntu_cluster_service }}"
    enabled: false
    state: stopped

- name: Check the Ubuntu cluster startup file
  ansible.builtin.stat:
    path: "{{ __ubuntu_cluster_start_conf }}"
  register: __start_conf

- name: Prevent the default cluster from starting automatically
  ansible.builtin.lineinfile:
    path: "{{ __ubuntu_cluster_start_conf }}"
    regexp: '^(auto|manual|disabled)$'
    line: manual
  when: __start_conf.stat.exists
  notify: Reload systemd

- name: Create /data
  ansible.builtin.file:
    path: /data
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create PostgreSQL data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  loop:
    - /data/postgres
    - "{{ postgres__data_dir }}"

- name: Initialize the database cluster
  ansible.builtin.command:
    cmd: "{{ __pg_bin_dir }}/pg_ctl initdb -D {{ postgres__data_dir }}"
    creates: "{{ postgres__data_dir }}/PG_VERSION"
  become_user: postgres
