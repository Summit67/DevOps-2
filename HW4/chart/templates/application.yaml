{{- range $component := list "backend" "frontend" }}
{{- $settings := index $.Values $component }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  annotations:
    kubernetes.io/change-cause: {{ $.Values.changeCause | quote }}
spec:
  replicas: {{ $settings.replicas }}
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ $.Release.Name }}-{{ $component }}
  template:
    metadata:
      labels:
        app: {{ $.Release.Name }}-{{ $component }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: {{ $component }}
          image: {{ $settings.image | quote }}
          imagePullPolicy: Never
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, "sleep 10"]
          ports:
            - {name: http, containerPort: {{ $settings.port }}}
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ $.Release.Name }}-config
                  key: {{ $component | upper }}_PORT
          resources:
            {{- toYaml $settings.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: {{ if eq $component "backend" }}/api/counter{{ else }}/{{ end }}, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: {{ if eq $component "backend" }}/api/counter{{ else }}/{{ end }}, port: http}
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: {{ if eq $component "backend" }}/api/counter{{ else }}/{{ end }}, port: http}
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
spec:
  type: ClusterIP
  selector:
    app: {{ $.Release.Name }}-{{ $component }}
  ports:
    - {name: http, port: {{ $settings.port }}, targetPort: http}
{{- end }}
