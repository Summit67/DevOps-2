host: counter.localtest.me
ingressClass: traefik
changeCause: Initial installation
tls:
  create: false
  existingSecret: counter-tls
  crt: ""
  key: ""
backend:
  image: counter-backend:hw4-v1
  replicas: 1
  port: 9000
  resources:
    requests: {cpu: 25m, memory: 32Mi}
