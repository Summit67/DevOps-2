database:
  enabled: false
  image: postgres:16-alpine
  existingSecret: postgres-auth
  storage: 256Mi
  storageClass: local-path
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 300m, memory: 192Mi}
