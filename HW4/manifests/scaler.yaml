apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-scaler
  namespace: hw4
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frontend-scaler
  namespace: hw4
rules:
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [counter-frontend]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-scaler
  namespace: hw4
subjects:
  - {kind: ServiceAccount, name: frontend-scaler, namespace: hw4}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: frontend-scaler
