# Source: counter/templates/database.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: counter-postgres
spec:
  serviceName: counter-postgres
  replicas: 1
  selector:
    matchLabels: {app: counter-postgres}
  template:
    metadata:
      labels: {app: counter-postgres}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: counter}
            - {name: POSTGRES_DB, value: counter}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-auth, key: password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          resources:
            limits:
              cpu: 300m
              memory: 192Mi
            requests:
              cpu: 25m
              memory: 64Mi
          startupProbe:
            exec: {command: [pg_isready, -U, counter, -d, counter]}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec: {command: [pg_isready, -U, counter, -d, counter]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, counter, -d, counter]}
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: counter-postgres-data}
        - name: init
          configMap: {name: counter-postgres-init}
---
# Source: counter/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: counter
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["counter.localtest.me"]
      secretName: counter-tls
  rules:
    - host: "counter.localtest.me"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: counter-backend
                port: {name: http}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: counter-frontend
                port: {name: http}
---
# Source: counter/templates/check.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: counter-check
  annotations:
    helm.sh/hook: post-install,post-upgrade,post-rollback
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: check
          image: "counter-backend:hw4-v1"
          imagePullPolicy: Never
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          command: [python, -u, -c]
          args:
            - |
              import urllib.request
              for url in ['http://counter-frontend:8080/', 'http://counter-backend:9000/api/counter']:
                  with urllib.request.urlopen(url, timeout=15) as r:
                      print(url, r.status)
                      assert r.status == 200
